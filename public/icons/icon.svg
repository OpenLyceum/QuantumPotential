  <path d="M56 150 H160 V420 H352 V150 H456" fill="none" stroke="#e0e0e0" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- energy levels -->
  <line x1="160" y1="370" x2="352" y2="370" stroke="#4fc3f7" stroke-width="8" opacity="0.7"/>
  <line x1="160" y1="290" x2="352" y2="290" stroke="#4fc3f7" stroke-width="8" opacity="0.7"/>
  <line x1="160" y1="200" x2="352" y2="200" stroke="#4fc3f7" stroke-width="8" opacity="0.7"/>
  <!-- first excited-state wavefunction on its level -->
  <path d="M110 290 C140 290 150 282 160 272 C190 232 220 222 256 290 C292 358 322 348 352 308 C362 298 372 290 402 290" fill="none" stroke="#ff8a3d" stroke-width="14" stroke-linecap="round"/>
