version: 2
updates:
  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "veillette"
    ignore:
      # typescript-eslint peer-depends on typescript ">=4.8.4 <6.1.0" and throws
      # at runtime on TS 7. An automatic major bump to 7.0.2 broke `npm ci` and
      # `npm run lint` on main. Hold typescript on 6.x until typescript-eslint
      # supports TS 7 - see typescript-eslint/typescript-eslint#10940.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "automated"
    # Group minor and patch updates together
    groups:
      development-dependencies:
        patterns:
          - "@typescript/*"
          - "eslint*"
          - "prettier"
          - "typescript"
          - "vite*"
        update-types:
          - "minor"
          - "patch"

  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "veillette"
    labels:
      - "dependencies"
      - "github-actions"
