name: Build and Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  NODE_VERSION: "20"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Security audit
        run: npm audit --audit-level=critical
      - name: Apply and commit formatting
        if: github.ref == 'refs/heads/main'
        run: |
          npm run format
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply prettier formatting [skip ci]"
            git push
          else
            echo "No formatting changes needed"
          fi

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          GITHUB_PAGES: true
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"
          retention-days: 5
      - name: Upload build artifact for release
        uses: actions/upload-artifact@v7
        with:
          name: build-dist
          path: "./dist"
          retention-days: 5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-dist
          path: dist
      - name: Generate changelog
        id: changelog
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const current = context.ref.replace('refs/tags/', '');

            // Find the tag released just before this one.
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100
            });
            const versionTags = tags.filter(tag => tag.name.startsWith('v'));
            const index = versionTags.findIndex(tag => tag.name === current);
            const previous = index === -1 ? undefined : versionTags[index + 1];

            // Without an earlier tag there is nothing to diff against, so fall
            // back to the commits reachable from this tag.
            let commits;
            if (previous) {
              const { data } = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: previous.name,
                head: context.sha
              });
              commits = data.commits;
            } else {
              const { data } = await github.rest.repos.listCommits({
                owner,
                repo,
                sha: context.sha,
                per_page: 50
              });
              commits = data;
            }

            return commits
              .map(commit => `- ${commit.commit.message.split('\n')[0]}`)
              .join('\n');
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/*
          body: |
            # Release ${{ github.ref_name }}
            ## Changes
            ${{ steps.changelog.outputs.result }}
            ## Quantum Bound States Simulation
            Interactive quantum mechanics simulation built with SceneryStack.
